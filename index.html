<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nairawhot - Real Money Whot</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b1d12; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .header { background: #162d1e; padding: 15px; border-radius: 10px; border: 1px solid #28a745; margin-bottom: 15px; }
        .balance-box { font-size: 28px; color: #28a745; font-weight: bold; margin: 10px 0; }
        .btn { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin: 5px; width: 45%; }
        .btn-deposit { background-color: #007bff; color: white; }
        .btn-withdraw { background-color: #dc3545; color: white; }
        .btn-play { background-color: #28a745; color: white; width: 90%; margin-top: 10px; }
        .card { background: #162d1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #23472f; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); padding-top: 50px; }
        .modal-content { background: #162d1e; width: 85%; max-width: 400px; margin: auto; padding: 20px; border-radius: 10px; text-align: left; }
        input, select { width: 92%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #28a745; background: #0b1d12; color: #fff; }
        #status { color: #ffc107; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h2>NAIRAWHOT</h2>
        <p style="margin: 0;">Wallet Balance</p>
        <div id="balance" class="balance-box">₦0.00</div>
        <button class="btn btn-deposit" onclick="openDeposit()">Deposit</button>
        <button class="btn btn-withdraw" onclick="openWithdrawModal()">Withdraw</button>
    </div>

    <div class="card">
        <h3>Matchmaking Lobby</h3>
        <button class="btn btn-play" onclick="findMatch(500)">Play ₦500 Table (Prize: ₦800)</button>
        <button class="btn btn-play" onclick="findMatch(1000)">Play ₦1,000 Table (Prize: ₦1,600)</button>
        <div id="status">Connecting...</div>
    </div>

    <!-- WITHDRAWAL MODAL -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <h3>Withdraw to Bank Account</h3>
            <label>Select Bank:</label>
            <select id="bankList"></select>
            <label>Account Number:</label>
            <input type="number" id="accountNumber" placeholder="0123456789">
            <label>Amount (₦):</label>
            <input type="number" id="withdrawAmount" placeholder="1000">
            <button class="btn btn-withdraw" style="width:100%; margin-top:10px;" onclick="processWithdrawal()">Submit Withdrawal</button>
            <button class="btn" style="width:100%; background:#6c757d; color:white;" onclick="closeWithdrawModal()">Cancel</button>
        </div>
    </div>

    <script>
        const socket = io('https://nairawhot.onrender.com');
        let userId = localStorage.getItem('nairawhot_user') || "player_" + Math.floor(Math.random() * 899999 + 100000);
        localStorage.setItem('nairawhot_user', userId);

        socket.on('connect', () => {
            document.getElementById('status').innerText = "Status: Connected to Server";
            socket.emit('register_user', { userId: userId });
        });

        socket.on('balance_update', (data) => {
            document.getElementById('balance').innerText = "₦" + data.balance.toFixed(2);
        });

        socket.on('waiting_for_opponent', (msg) => {
            document.getElementById('status').innerText = msg;
        });

        socket.on('match_started', (data) => {
            document.getElementById('status').innerText = `Match Active! Pot: ₦${data.winnerPrize + data.houseCommission}. Prize: ₦${data.winnerPrize}`;
        });

        socket.on('error_message', (msg) => { alert(msg); });

        function findMatch(stake) {
            document.getElementById('status').innerText = "Searching for an opponent...";
            socket.emit('find_match', { userId: userId, stake: stake });
        }

        async function openDeposit() {
            const amount = prompt("Enter deposit amount (₦):", "1000");
            if (!amount || amount < 100) return alert("Minimum deposit is ₦100");

            const res = await fetch('https://nairawhot.onrender.com/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: `${userId}@nairawhot.com`, amount: amount, userId: userId })
            });

            const data = await res.json();
            if (data.status && data.authorization_url) {
                window.location.href = data.authorization_url;
            } else {
                alert("Could not start payment.");
            }
        }

        async function openWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'block';
            const res = await fetch('https://nairawhot.onrender.com/api/banks');
            const data = await res.json();
            if (data.status) {
                const select = document.getElementById('bankList');
                select.innerHTML = '';
                data.banks.forEach(bank => {
                    let opt = document.createElement('option');
                    opt.value = bank.code;
                    opt.innerHTML = bank.name;
                    select.appendChild(opt);
                });
            }
        }

        function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }

        async function processWithdrawal() {
            const amount = document.getElementById('withdrawAmount').value;
            const bankCode = document.getElementById('bankList').value;
            const accountNumber = document.getElementById('accountNumber').value;

            if (!amount || !accountNumber) return alert("Fill in all fields.");

            const res = await fetch('https://nairawhot.onrender.com/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, amount: amount, bankCode: bankCode, accountNumber: accountNumber })
            });

            const data = await res.json();
            alert(data.message);
            if (data.status) closeWithdrawModal();
        }
    </script>
</body>
</html>
