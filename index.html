<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nairawhot Casino</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #0b1d12; color: #fff; padding: 20px; }
        .card { background: #162d1e; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 400px; border: 1px solid #28a745; }
        button { padding: 12px 20px; font-size: 16px; margin: 8px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; width: 80%; }
        button.deposit { background-color: #007bff; }
        #status { font-weight: bold; color: #ffc107; margin-top: 15px; }
        .balance { font-size: 24px; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <h1>NAIRAWHOT CASINO</h1>

    <div class="card">
        <p>Wallet Balance</p>
        <div id="balance" class="balance">₦0.00</div>
        <br>
        <button class="deposit" onclick="depositMoney()">Deposit Funds (Paystack)</button>
    </div>

    <div class="card">
        <h3>Matchmaking Lobby</h3>
        <button onclick="findMatch(500)">Play ₦500 Table</button>
        <button onclick="findMatch(1000)">Play ₦1,000 Table</button>
        <div id="status">Status: Disconnected</div>
    </div>

    <script>
        const socket = io('https://nairawhot.onrender.com');
        const userId = "player_" + Math.floor(Math.random() * 10000);

        socket.on('connect', () => {
            document.getElementById('status').innerText = "Connected to Server";
            socket.emit('register_user', { userId: userId });
        });

        socket.on('balance_update', (data) => {
            document.getElementById('balance').innerText = "₦" + data.balance.toFixed(2);
        });

        socket.on('waiting_for_opponent', (msg) => {
            document.getElementById('status').innerText = msg;
        });

        socket.on('match_started', (data) => {
            document.getElementById('status').innerText = `Match Started! Winner Gets: ₦${data.winnerPrize} (House Cut: ₦${data.houseCut})`;
        });

        socket.on('error_message', (msg) => {
            alert(msg);
            document.getElementById('status').innerText = "Error: " + msg;
        });

        function findMatch(stake) {
            document.getElementById('status').innerText = "Searching for opponent...";
            socket.emit('find_match', { userId: userId, stake: stake });
        }

        async function depositMoney() {
            const amount = prompt("Enter amount to deposit (₦):", "1000");
            if (!amount) return;

            const response = await fetch('https://nairawhot.onrender.com/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: `${userId}@nairawhot.com`, amount: amount, userId: userId })
            });

            const data = await response.json();
            if (data.status && data.authorization_url) {
                window.location.href = data.authorization_url; // Opens Paystack Payment Page
            } else {
                alert("Deposit initialization failed.");
            }
        }
    </script>
</body>
</html>
